name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # ============================================
  # JOB 1: CI - Validación de código
  # ============================================
  ci:
    name: Validar código
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Type Check (TypeScript)
        run: pnpm tsc --noEmit

      - name: Lint (ESLint)
        run: pnpm lint

      # Si tuvieras tests, los ejecutarías aquí:
      # - name: Tests
      #   run: pnpm test

  # ============================================
  # JOB 2: Build - Construcción del artefacto
  # ============================================
  build:
    name: Construir aplicación
    runs-on: ubuntu-latest
    needs: ci
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Build con Vite
        run: pnpm build

      - name: Subir artefacto
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  # ============================================
  # JOB 3: CD - Despliegue a producción
  # ============================================
  deploy:
    name: Desplegar a GitHub Pages
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Desplegar a GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
